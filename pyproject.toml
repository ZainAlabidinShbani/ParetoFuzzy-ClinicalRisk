[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzyrisk"
version = "0.1.0"
description = "Pareto-optimal calibrated and interpretable fuzzy risk scoring via NSGA-II"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fuzzyrisk = ["dataset_pins.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: test downloads dev datasets (cached under data/cache)"]
addopts = "-ra"
